plugins { id 'com.android.application' }
android {
    namespace 'ru.domashniy.balance'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'ru.domashniy.balance'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(providers.gradleProperty('appVersionCode').getOrElse('10'))
        versionName providers.gradleProperty('appVersionName').getOrElse('1.4.2')
        buildConfigField 'String', 'UPDATE_REPO', '"D3R3j/calorie-macro-tracker"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}
