name: Signed Android release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, for example 1.0.1 (no v)'
        required: true
      version_code:
        description: 'Integer greater than the last release'
        required: true
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: balance
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.p12
      VERSION: ${{ inputs.version }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Validate inputs and restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [[ "$VERSION" =~ ^[0-9]{1,6}\.[0-9]{1,6}\.[0-9]{1,6}$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,8}$ ]]
          test -n "$KEYSTORE_B64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease -PappVersionName="$VERSION" -PappVersionCode="$VERSION_CODE"
          cp app/build/outputs/apk/release/app-release.apk calorie-macro-tracker.apk
          sha256sum calorie-macro-tracker.apk > calorie-macro-tracker.apk.sha256
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" calorie-macro-tracker.apk calorie-macro-tracker.apk.sha256 --target "$GITHUB_SHA" --title "Домашний баланс $VERSION" --generate-notes
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"

